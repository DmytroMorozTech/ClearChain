<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the layout reach under a notch; the bottom navigation
         pays it back with `env(safe-area-inset-bottom)`. Deliberately no `maximum-scale`
         or `user-scalable=no` — blocking pinch zoom fails WCAG 1.4.4. The input-zoom
         problem that usually motivates them is solved in the theme instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#4F46E5" />
    <!-- Belt and braces with robots.txt: the file asks a crawler not to fetch, this
         asks any that fetched anyway not to index. Neither is a security control --
         that is what the sign-in gate is for. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="ClearChain — supply chain compliance and transparency dashboard."
    />
    <title>ClearChain</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
