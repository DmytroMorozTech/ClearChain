# The whole application on one host: database, API and the web server that serves the
# built frontend and proxies /api to the API on the same origin.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Everything it needs comes from a .env file beside this one. Copy .env.prod.example
# and fill it in — the file is gitignored and must never be committed.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately not published to the host. Only the API needs it, and it reaches it
    # over the compose network; exposing 5432 on a public instance would be handing the
    # database to the internet.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
      AUTH_USER: ${AUTH_USER}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
      AUTH_SECRET: ${AUTH_SECRET}
      DEMO_READONLY: ${DEMO_READONLY:-false}
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      # One proxy in front: the web service below.
      TRUST_PROXY_HOPS: 1
    volumes:
      # A directory inside a container is ephemeral. Without this, every certificate
      # uploaded through the running site disappears on the next deployment.
      - uploads:/app/uploads
    # Not published either: nginx is the only thing that talks to it.

  # ── One-shot tooling ───────────────────────────────────────────────────────
  # The runtime image deliberately carries no Prisma CLI, so migrations cannot run from
  # it — and running them on application start is worse: a slow or failed migration
  # would take the service down with it, and every replica would race to apply the same
  # change. These target the builder stage, which already has the CLI and the schema.
  #
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm seed
  migrate:
    profiles: ['tools']
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    working_dir: /app/backend
    command: npx prisma migrate deploy

  seed:
    profiles: ['tools']
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    # Same uid as the runtime API (node = 1000), so the PDFs it writes into the uploads
    # volume are owned by the user that later serves them, not by root.
    user: '1000:1000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      UPLOAD_DIR: /app/uploads
      # The seed only reads these through the shared env module; it never authenticates.
      AUTH_PASSWORD_HASH: unused-by-the-seed
      AUTH_SECRET: unused-by-the-seed-but-long-enough-for-the-schema
    volumes:
      # Writes its generated certificate PDFs into the same volume the API serves from.
      - uploads:/app/uploads
    working_dir: /app/backend
    command: node prisma/seed/index.ts

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      # TLS terminates here when a certificate is mounted; see the deployment notes.
      - '443:443'
    volumes:
      # Cloudflare origin certificate, if used. The bind mount is optional: nginx only
      # listens on 443 when a config referencing these exists.
      - ./docker/nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  uploads:
