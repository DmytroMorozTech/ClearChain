# TLS variant of app.conf, used in production behind Cloudflare in Full (strict) mode.
#
# It is mounted over the image's default :80-only config by docker-compose.tls.yml, so
# the base stack stays plain HTTP for local verification and only production terminates
# TLS. The certificate is a Cloudflare Origin Certificate (valid 15 years) placed in
# docker/nginx/certs/ — see the deployment runbook.

# Everything on :80 is redirected to HTTPS. Cloudflare talks to the origin over 443 in
# Full (strict); this catches anything that reaches the box on 80 directly.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Modern protocols only. Cloudflare is the sole client of this origin, so there is no
    # legacy browser to accommodate.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cloudflare is the only client of this origin, so $remote_addr is always a Cloudflare
    # edge server. Restore the visitor's address from CF-Connecting-IP — trusted only when
    # the connection really comes from one of Cloudflare's published ranges, so it cannot
    # be forged by reaching the origin directly. Without this every visitor behind the
    # same edge shares one rate-limit bucket in the API.
    # Ranges: https://www.cloudflare.com/ips/ (fetched 2026-10-09; they change rarely).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare terminates the browser's TLS and forwards over 443 to here; the app
        # reads this to know the original scheme was https.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
