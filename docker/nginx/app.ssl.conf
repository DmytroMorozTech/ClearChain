# TLS variant of app.conf, used in production behind Cloudflare in Full (strict) mode.
#
# It is mounted over the image's default :80-only config by docker-compose.tls.yml, so
# the base stack stays plain HTTP for local verification and only production terminates
# TLS. The certificate is a Cloudflare Origin Certificate (valid 15 years) placed in
# docker/nginx/certs/ — see the deployment runbook.

# Everything on :80 is redirected to HTTPS. Cloudflare talks to the origin over 443 in
# Full (strict); this catches anything that reaches the box on 80 directly.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Modern protocols only. Cloudflare is the sole client of this origin, so there is no
    # legacy browser to accommodate.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare terminates the browser's TLS and forwards over 443 to here; the app
        # reads this to know the original scheme was https.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
