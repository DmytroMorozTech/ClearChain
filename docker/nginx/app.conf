server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 5 MB by the API; refusing a larger body here means it never
    # crosses the network twice only to be rejected upstream.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API and the app share an origin, which is what keeps CORS out of the picture
    # and lets the session cookie behave like an ordinary first-party cookie.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # The API counts requests per client address. Without these it would see the
        # nginx container for every caller and the rate limit would protect nothing.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Certificate downloads stream; buffering them would hold the whole file in
        # nginx before a single byte reached the browser.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Hashed asset filenames change whenever their contents do, so they can be cached
    # indefinitely without ever serving a stale one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the opposite: it names the current asset hashes, so a cached copy
    # would keep pointing at a deployment that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /suppliers/<id> is a route the browser owns, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
